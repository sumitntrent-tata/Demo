name: Demo CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t demo-app:latest .

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:latest
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:latest
          format: cyclonedx
          output: sbom.json
          exit-code: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy pandas openpyxl

      - name: Verify Python Packages
        run: |
          python -c "import numpy; print('Numpy OK')"
          python -c "import pandas; print('Pandas OK')"
          python -c "import openpyxl; print('Openpyxl OK')"

      - name: Convert SBOM JSON to Excel
        run: |
          python << 'EOF'
          import json
          import pandas as pd

          with open("sbom.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          rows = []

          for comp in data.get("components", []):
              rows.append({
                  "Name": comp.get("name", ""),
                  "Version": comp.get("version", ""),
                  "Type": comp.get("type", ""),
                  "PURL": comp.get("purl", ""),
                  "Publisher": comp.get("publisher", "")
              })

          df = pd.DataFrame(rows)

          if df.empty:
              df = pd.DataFrame([{
                  "Name": "No Components Found",
                  "Version": "",
                  "Type": "",
                  "PURL": "",
                  "Publisher": ""
              }])

          df.to_excel("sbom.xlsx", index=False)

          print("Excel report generated successfully")
          EOF

      - name: Upload JSON SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-json
          path: sbom.json

      - name: Upload Excel SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-excel
          path: sbom.xlsx

      - name: Upload SARIF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif

      - name: Finish Pipeline
        run: echo "Pipeline completed successfully"
